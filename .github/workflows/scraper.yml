name: Test Scrapling ingestion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install Scrapling parser for fixture tests
        run: python -m pip install 'scrapling==0.5.1'
      - name: Run parser and guardrail tests
        run: python -m unittest discover -s scraper/tests -v
      - name: Exercise CLI without network
        run: |
          python -m scraper.collector --config scraper/examples/fixture-source.json --output /tmp/deal-candidates.json
          python -m scraper.history --db /tmp/prices.sqlite import --input /tmp/deal-candidates.json
